[package]
name = "gdk-hello"
version = "0.1.0"
description = "GDK Rust hello-world tutorial"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
dotenvy = "0.15.7"
futures = "0.3"
# Keep the published SDK fixed through course implementation and verification.
goose-agent = "=0.1.0-alpha.11"
goose-providers = { version = "=0.1.0-alpha.11", features = ["rustls-tls"] }
rmcp = "=3.4.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rust_decimal = "1.43.0"
sha2 = "0.10"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
# Supplied Lesson 14 telemetry infrastructure; no SDK/provider upgrade.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["registry"] }
tracing-opentelemetry = "=0.33.0"
opentelemetry = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.1", features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }

# Supplied catalog seeding only; the interactive tutor remains the default binary.
[[example]]
name = "seed_mlflow_dataset"
path = "lessons/14-agent-evaluation/seed_dataset.rs"
