[package]
name = "gdk-hello"
version = "0.1.0"
description = "GDK Rust hello-world tutorial"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
dotenvy = "0.15.7"
futures = "0.3"
goose-providers = { version = "=0.1.0-alpha.10", features = ["rustls-tls"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
