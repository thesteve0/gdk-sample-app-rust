<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Turn 2 · save the assistant request</title>
<desc id="description">Turn 2 · save the assistant request. Run 2 · inference pass; then reload from the top. Same Session across both turns. maximum_planned_loss remains available. user + assistant · first exchange: Retained in order, unchanged.. user · maximum planned loss: Entry $51.20 · stop $50.70 · 200 shares. assistant · tool request: maximum_planned_loss; id: example-call-1; entry_price: &quot;51.20&quot;; stop_price: &quot;50.70&quot; · share_count: 200. Provider returns a structured request. Inference reconstructs the message. Effects propose appending the request. Effect handler saves it to the store. Reload: a request has no response yet. Events support presentation; Effects and the effect handler save recorded state. Narrated example, not guaranteed model behavior.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif">
