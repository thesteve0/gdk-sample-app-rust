<text x="790" y="265" font-size="28" font-weight="bold" fill="#172b40">StateMachine · what happens now</text>
<text x="795" y="310" font-size="25" font-weight="normal" fill="#172b40">Provider returns a structured request.</text>
<text x="795" y="353" font-size="25" font-weight="normal" fill="#172b40">Inference reconstructs the message.</text>
<text x="795" y="396" font-size="25" font-weight="normal" fill="#172b40">Effects propose appending the request.</text>
<text x="795" y="439" font-size="25" font-weight="normal" fill="#172b40">Effect handler saves it to the store.</text>
<text x="795" y="482" font-size="25" font-weight="normal" fill="#172b40">Reload: a request has no response yet.</text>
<text x="795" y="615" font-size="21" font-weight="bold" fill="#172b40">Provider → application: request, not execution</text>
<rect x="40" y="696" width="730" height="91" rx="9" fill="#fff7e8" stroke="#8d6723" stroke-width="2" stroke-dasharray="9 5"/>
<text x="60" y="728" font-size="23" font-weight="bold" fill="#172b40">DISPLAY · Operation → Emitter → Events → application</text>
<text x="60" y="764" font-size="23" font-weight="normal" fill="#172b40">Notifications / fragments; presentation does not save.</text>
<rect x="790" y="696" width="770" height="91" rx="9" fill="#edf6ef" stroke="#2b6440" stroke-width="2"/>
<text x="810" y="728" font-size="23" font-weight="bold" fill="#172b40">SAVE · Operation → Effects → effect handler → store</text>
<text x="810" y="764" font-size="23" font-weight="normal" fill="#172b40">Complete messages; reload saved state for the next pass.</text>
<text x="45" y="835" font-size="27" font-weight="bold" fill="#172b40">Predict: which Operation now has work, and why?</text>
<text x="45" y="877" font-size="20" font-weight="normal" fill="#172b40">Legend: dashed box = presentation path · solid box = recorded-state path · arrows = flow, not timing</text>
