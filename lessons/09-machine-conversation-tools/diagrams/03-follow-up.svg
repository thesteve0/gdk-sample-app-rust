<title id="title">Turn 2 · append, do not replace</title>
<desc id="description">Turn 2 · append, do not replace. A new run starts against the same Session. Same Session across both turns. maximum_planned_loss remains available. user · conceptual question: What is stop-loss referring to; in day trading?. assistant · conceptual explanation: First exchange retained.. user · maximum planned loss: Hypothetical long position:; entry $51.20 · stop $50.70 · 200 shares. Application appends the follow-up. Run 2 loads the same Session. Tools Operation: no pending request yet. Inference asks the provider/model. Events support presentation; Effects and the effect handler save recorded state. Narrated example, not guaranteed model behavior.</desc>
