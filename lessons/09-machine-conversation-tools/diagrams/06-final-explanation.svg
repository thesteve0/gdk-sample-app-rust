<title id="title">Turn 2 · explain, then no work</title>
<desc id="description">Turn 2 · explain, then no work. Run 2 ends; the application regains control. Same Session across both turns. maximum_planned_loss remains available. user + assistant · first exchange: Retained in order, unchanged.. user · maximum planned loss: Entry $51.20 · stop $50.70 · 200 shares. assistant · tool request: maximum_planned_loss · id: example-call-1. user role · tool response: id: example-call-1 · result: $100.00. assistant · final explanation: $100.00 maximum planned loss; excludes; fees, slippage, and gaps through the stop.. Reload: the request is answered. Tools Operation declines; inference acts. Provider explains the returned result. Effects + handler save the final answer. Reload: neither step has work. No work → return to the application. Events support presentation; Effects and the effect handler save recorded state. Narrated example, not guaranteed model behavior.</desc>
