<text x="849" y="489" font-size="28" font-weight="normal">It does not wait here for a new question.</text><rect x="48" y="690" width="1504" height="100" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="3"/><text x="72" y="734" font-size="30" font-weight="bold">Why the next decision differs</text><text x="72" y="784" font-size="28" font-weight="normal">Another user input must be recorded by the application before another run.</text>
