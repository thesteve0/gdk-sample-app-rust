<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">05 • Simple exchange — pass 2</title><desc id="desc">1 • user What is the capital of France?  2 • assistant Paris is the capital of France.. Inference declines: ordinary reply is complete.  This minimal assembly has no other work. No Effect is proposed; store unchanged.  StateMachine returns control to application. It does not wait here for a new question.. Another user input must be recorded by the application before another run.</desc>
