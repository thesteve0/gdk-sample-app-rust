<text x="72" y="289" font-size="28" font-weight="normal">What is the capital of France?</text>
<text x="72" y="329" font-size="28" font-weight="normal"></text>
<text x="72" y="369" font-size="28" font-weight="normal">2 • assistant</text>
<text x="72" y="409" font-size="28" font-weight="normal">Paris is the capital of France.</text><rect x="825" y="155" width="727" height="490" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="3"/><text x="849" y="199" font-size="30" font-weight="bold">Operation / proposed Effect / store</text><text x="849" y="249" font-size="28" font-weight="normal">Inference declines: ordinary reply is complete.</text>
<text x="849" y="289" font-size="28" font-weight="normal"></text>
<text x="849" y="329" font-size="28" font-weight="normal">This minimal assembly has no other work.</text>
