<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">01 • Who owns what</title><desc id="desc">The application owns the store and effect handler. StateMachine loads a Session, evaluates Operations, and routes their proposed Effects to the handler. A separate live input can enter an Operation; Steer in Goose is an example, not required infrastructure.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>
<rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="48" y="62" font-size="38" font-weight="bold">01 • Who owns what</text>
<text x="48" y="108" font-size="26" font-weight="normal">Narrated conceptual example • not a runtime trace or provider transcript</text>
<rect x="48" y="152" width="470" height="210" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="72" y="196" font-size="30" font-weight="bold">Application-owned store</text><text x="72" y="246" font-size="28" font-weight="normal">Recorded conversation</text>
<text x="72" y="286" font-size="28" font-weight="normal">+ relevant Session information</text><rect x="570" y="152" width="420" height="210" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="594" y="196" font-size="30" font-weight="bold">Loaded Session</text><text x="594" y="246" font-size="28" font-weight="normal">Read for this pass</text>
<text x="594" y="286" font-size="28" font-weight="normal">Not Operation statuses</text><rect x="1040" y="152" width="512" height="210" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="1064" y="196" font-size="30" font-weight="bold">StateMachine</text><text x="1064" y="246" font-size="28" font-weight="normal">Ordered steps</text>
<text x="1064" y="286" font-size="28" font-weight="normal">First applicable step wins</text><polyline points="518,245 570,245" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="524" y="226" font-size="26" font-weight="normal">load</text><polyline points="990,245 1040,245" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="994" y="226" font-size="26" font-weight="normal">read</text><rect x="1040" y="450" width="512" height="210" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="1064" y="494" font-size="30" font-weight="bold">Operation</text><text x="1064" y="544" font-size="28" font-weight="normal">Checks and acts itself</text>
<text x="1064" y="584" font-size="28" font-weight="normal">Returns proposed Effects</text><polyline points="1300,362 1300,450" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="1320" y="408" font-size="26" font-weight="normal">evaluate</text><rect x="570" y="450" width="420" height="210" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="594" y="494" font-size="30" font-weight="bold">Effects</text><text x="594" y="544" font-size="28" font-weight="normal">Proposed data changes</text>
<text x="594" y="584" font-size="28" font-weight="normal">Not status updates</text><polyline points="1040,550 990,550" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="994" y="530" font-size="26" font-weight="normal">return</text><rect x="48" y="450" width="470" height="210" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="72" y="494" font-size="30" font-weight="bold">Application effect handler</text><text x="72" y="544" font-size="28" font-weight="normal">Applies Effects to the store</text>
<text x="72" y="584" font-size="28" font-weight="normal">Machine routes; app saves</text><polyline points="570,550 518,550" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="522" y="530" font-size="26" font-weight="normal">apply</text><polyline points="280,450 280,362" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="300" y="415" font-size="26" font-weight="normal">save</text><text x="580" y="710" font-size="28" font-weight="normal">Outside the Session: live user-guidance queue</text>
<text x="580" y="750" font-size="28" font-weight="normal">Goose example: Steer (not implemented here)</text><polyline points="600,770 1280,770 1280,660" fill="none" stroke="#0f172a" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrow)"/><text x="1310" y="748" font-size="26" font-weight="normal">live input</text>
<line x1="48" y1="810" x2="1552" y2="810" stroke="#64748b" stroke-width="2"/>
<text x="48" y="852" font-size="26" font-weight="normal">Legend: solid arrow = labeled flow • dashed arrow = live input • boxes = data or actors</text>
</g></svg>
