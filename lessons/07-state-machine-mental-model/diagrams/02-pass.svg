<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">02 • One pass, then re-evaluation</title><desc id="desc">Load Session, check earlier Operation, then later Operation only if earlier declines, with inference last in this teaching assembly. First applicable step acts, returns Effects, and the application saves them. Reload from the top unless it yields. If all decline, return control.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>
<rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="48" y="62" font-size="38" font-weight="bold">02 • One pass, then re-evaluation</text>
<text x="48" y="108" font-size="26" font-weight="normal">Narrated conceptual example • not a runtime trace or provider transcript</text>
<rect x="48" y="160" width="440" height="140" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="72" y="204" font-size="30" font-weight="bold">1 • Load Session</text><text x="72" y="254" font-size="28" font-weight="normal">Read application store</text><rect x="570" y="160" width="460" height="140" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="594" y="204" font-size="30" font-weight="bold">2 • Earlier Operation</text><text x="594" y="254" font-size="28" font-weight="normal">Checks; may decline</text><rect x="1110" y="160" width="442" height="140" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="1134" y="204" font-size="30" font-weight="bold">3 • Later Operation</text><text x="1134" y="254" font-size="28" font-weight="normal">Only if earlier declines</text><polyline points="488,230 570,230" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="492" y="210" font-size="26" font-weight="normal">check</text><polyline points="1030,230 1110,230" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="1032" y="210" font-size="26" font-weight="normal">declines</text><rect x="1110" y="390" width="442" height="150" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="1134" y="434" font-size="30" font-weight="bold">4 • Inference fallback</text><text x="1134" y="484" font-size="28" font-weight="normal">Only if earlier steps decline</text><polyline points="1330,300 1330,390" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="1350" y="355" font-size="26" font-weight="normal">declines</text><rect x="570" y="390" width="460" height="150" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="594" y="434" font-size="30" font-weight="bold">First applicable step acts</text><text x="594" y="484" font-size="28" font-weight="normal">Returns proposed Effects</text>
<text x="594" y="524" font-size="28" font-weight="normal">No later step acts this pass</text><polyline points="1110,465 1030,465" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="1036" y="445" font-size="26" font-weight="normal">applies</text><rect x="48" y="390" width="440" height="150" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="72" y="434" font-size="30" font-weight="bold">5 • Apply Effects</text><text x="72" y="484" font-size="28" font-weight="normal">Application handler saves</text><polyline points="570,465 488,465" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="500" y="445" font-size="26" font-weight="normal">route</text><polyline points="100,390 100,340 270,340 270,300" fill="none" stroke="#0f172a" stroke-width="4"  marker-end="url(#arrow)"/><text x="116" y="364" font-size="26" font-weight="normal">reload; start at top</text><text x="48" y="620" font-size="30" font-weight="normal">Any applicable step follows the same Effects → apply → reload path.</text>
<text x="48" y="660" font-size="30" font-weight="normal">The arrow does not mean “advance to the next Operation.”</text><rect x="48" y="700" width="740" height="85" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="3"/><text x="72" y="744" font-size="30" font-weight="bold">No applicable step → return control</text><rect x="820" y="700" width="732" height="85" rx="12" fill="#fff7ed" stroke="#334155" stroke-width="3"/><text x="844" y="744" font-size="30" font-weight="bold">Explicit yield → apply, then return control</text>
<line x1="48" y1="810" x2="1552" y2="810" stroke="#64748b" stroke-width="2"/>
<text x="48" y="852" font-size="26" font-weight="normal">Legend: solid arrow = labeled flow • dashed arrow = live input • boxes = data or actors</text>
</g></svg>
