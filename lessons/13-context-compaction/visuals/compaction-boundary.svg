<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Compaction shortens history, not learner wording or authority</title>
  <desc id="desc">Conceptual before and after trace in the same Session. Application state keeps exact learner wording and IDs outside shortened conversation history, separate from persistent notes. Opening and latest two complete genuine learner exchanges survive; older history becomes one fallible assistant-derived summary. Only archived originals omitted from retained history are projected as counted, untrusted historical input, never semantic or write authority. Proposal quotations must come from the latest genuine reply in the current exchange, not older retained replies, archive or summary. Failure preserves history and archive; a saved declaration is not rolled back. Static context remains counted.</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #152338; }
      .title { font-size: 41px; font-weight: 700; }
      .heading { font-size: 29px; font-weight: 700; }
      .body { font-size: 27px; }
      .small { font-size: 24px; }
      .box { stroke: #415875; stroke-width: 3; rx: 16; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#385d81"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="45" y="59" class="title">Shorten history. Keep exact wording and authority separate.</text>
  <text x="45" y="99" class="small">Lesson 13 • conceptual policy trace, not captured model output • same Session throughout</text>

  <rect x="45" y="122" width="900" height="157" class="box" fill="#e4f0fc"/>
  <text x="65" y="163" class="heading">Application state • outside shortened history</text>
  <text x="65" y="201" class="body">Provenance • tool IDs • settled decisions • revision</text>
  <text x="65" y="237" class="body">Exact learner archive: original wording + message IDs</text>
  <text x="65" y="267" class="small">Bounded in-Session data • not a full tutor transcript or disk save</text>
  <rect x="970" y="122" width="585" height="157" class="box" fill="#e8f5ec"/>
  <text x="990" y="163" class="heading">Persistent learning record</text>
  <text x="990" y="204" class="body">Consent + narrow declaration</text>
  <text x="990" y="242" class="body">or independent local approval</text>
  <text x="45" y="317" class="body">Generated summary text rewrites neither application authority nor persistent notes.</text>

  <text x="45" y="356" class="heading">WORKING HISTORY — BEFORE</text>
  <text x="1030" y="356" class="heading">AFTER • SAME SESSION</text>
  <rect x="45" y="377" width="485" height="66" class="box" fill="#e4f0fc"/>
  <text x="70" y="420" class="body">Original opening</text>
  <rect x="45" y="458" width="485" height="107" class="box" fill="#fff3d3"/>
  <text x="70" y="499" class="body">Eligible older exchanges</text>
  <text x="70" y="540" class="small">+ previous summary, if present</text>
  <rect x="45" y="580" width="485" height="145" class="box" fill="#e4f0fc"/>
  <text x="70" y="619" class="body">Latest TWO complete genuine</text>
  <text x="70" y="657" class="body">learner exchanges</text>
  <text x="70" y="698" class="small">Tool pairs, IDs, metadata kept</text>

  <rect x="590" y="387" width="380" height="333" class="box" fill="#ffffff"/>
  <text x="613" y="431" class="heading">SAFE BOUNDARY</text>
  <text x="613" y="474" class="small">Approvals settled</text>
  <text x="613" y="508" class="small">No pending pair split</text>
  <text x="613" y="553" class="small">Isolated tool-free summary</text>
  <text x="613" y="587" class="small">Stored history, not archive</text>
  <text x="613" y="632" class="small">Validate + check revision</text>
  <text x="613" y="666" class="small">Apply replacement Effect</text>
  <text x="613" y="700" class="small">NO write authority</text>
  <path d="M536,512 L583,512" stroke="#385d81" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M975,512 L1023,512" stroke="#385d81" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1030" y="377" width="525" height="66" class="box" fill="#e4f0fc"/>
  <text x="1055" y="420" class="body">Same original opening</text>
  <rect x="1030" y="458" width="525" height="107" class="box" fill="#fff3d3"/>
  <text x="1055" y="499" class="body">ONE fallible, lossy summary</text>
  <text x="1055" y="540" class="small">Assistant data, NOT instructions</text>
  <rect x="1030" y="580" width="525" height="145" class="box" fill="#e4f0fc"/>
  <text x="1055" y="619" class="body">Same latest TWO exchanges</text>
  <text x="1055" y="657" class="small">Same tool pairs, IDs, metadata</text>
  <text x="1055" y="698" class="small">Quote source: latest exchange ONLY</text>

  <rect x="45" y="742" width="1510" height="58" class="box" fill="#eef2f7"/>
  <text x="65" y="779" class="small">Also counted: instructions • teaching guidance • consented notes / declarations • tool definitions</text>
  <rect x="45" y="815" width="1510" height="79" class="box" fill="#e4f0fc"/>
  <text x="65" y="847" class="small">Omitted originals → untrusted historical input • counted in budget + estimate; retained text is not doubled.</text>
  <text x="65" y="881" class="small">Exact wording ≠ meaning, mastery, agreement or write authority. Archive is NOT a proposal-quote path.</text>
  <rect x="45" y="909" width="1510" height="73" class="box" fill="#fcebed"/>
  <text x="65" y="939" class="small">Failure: keep history + archive; an already saved declaration stays saved. No guaranteed shrink.</text>
  <text x="65" y="971" class="small">New citations need current evidence, not old IDs. Proposal quotes: latest genuine reply in this exchange only.</text>
</svg>
